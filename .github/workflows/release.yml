name: Build Edi

on:
  workflow_dispatch:

  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            platform: windows-latest
            args: ""

          - name: macOS Apple Silicon
            platform: macos-latest
            args: "--target aarch64-apple-darwin"

          - name: macOS Intel
            platform: macos-latest
            args: "--target x86_64-apple-darwin"

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.args == '--target aarch64-apple-darwin' && 'aarch64-apple-darwin' || matrix.args == '--target x86_64-apple-darwin' && 'x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Edi ${{ github.ref_name }}"
          releaseBody: "Edi desktop assistant release."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload Windows installer
        if: matrix.name == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: edi-windows
          path: |
            src-tauri/target/release/bundle/msi/*
            src-tauri/target/release/bundle/nsis/*

      - name: Upload macOS installer
        if: startsWith(matrix.name, 'macOS')
        uses: actions/upload-artifact@v4
        with:
          name: edi-${{ matrix.name }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*
            src-tauri/target/**/release/bundle/macos/*
